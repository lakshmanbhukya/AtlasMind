name: AtlasMind CI

# Server only, by choice: typecheck and test, then build and push the server
# image from main. The client deploys to Netlify and has no CI job here; run its
# checks locally (lint, unit tests, build, Playwright e2e).
# The `changes` job keeps a workflow-only change from releasing an image.
on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/ci.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      server_src: ${{ steps.filter.outputs.server_src }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          server:
            - 'server/**'
            - '.github/workflows/ci.yml'
          server_src:
            - 'server/**'

  build-and-test-server:
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    - name: Install dependencies
      run: |
        cd server
        npm ci
    - name: Typecheck
      run: |
        cd server
        npm run typecheck

    - name: Install FFmpeg for managed voice tests
      run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

    - name: Run tests
      run: |
        cd server
        npm test

    - name: Discord Notification
      if: success()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        title: "Server Tests Passed"
        description: "AtlasMind server tests completed successfully on ${{ github.ref_name }}."
        color: 0x00ff00

  # Gated on the server job and on real server changes.
  release:
    needs: [changes, build-and-test-server]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server_src == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Server Image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/atlasmind-server:latest,${{ secrets.DOCKERHUB_USERNAME }}/atlasmind-server:${{ github.sha }}

    - name: Discord Notification (Server Image)
      if: success()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        title: "Server Image Pushed"
        description: "AtlasMind server image successfully pushed to Docker Hub."
        color: 0x0000ff
