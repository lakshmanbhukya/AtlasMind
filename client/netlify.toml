[build]
  command = "npm run build"
  publish = "dist"
  base = "client"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ─── Security headers (F13b) ────────────────────────────────────────────────
# Netlify combines every rule whose path matches a request, so the CSP is set
# on the app routes only ("/", "/index.html", "/shared/*") rather than "/*":
# a "/*" CSP would also land on /shared/* and its frame-ancestors would apply
# there too. Shared widgets must stay embeddable, so their CSP has no
# frame-ancestors.
#
# The CSP is Report-Only until the production API origin is known; see the
# fixes.md follow-up to narrow connect-src and switch to enforcing.
# 'unsafe-inline' in style-src covers React/Recharts/GSAP inline style
# attributes; scripts are same-origin modules only.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Voice queries record from the microphone.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
